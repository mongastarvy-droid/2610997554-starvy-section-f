<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>
    <h1>Readers' Haven - Book Registration & Order Form</h1>

    <form action="#" target="_self" method="post"
          enctype="multipart/form-data">

        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required><br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter mobile number" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               required><br><br>

        <label for="delivery">Delivery Date:</label>
        <input type="date" id="delivery" name="delivery"><br><br>

        <label for="time">Preferred Delivery Time:</label>
        <input type="time" id="time" name="time"><br><br>

        <label for="category">Favorite Book Category:</label>
        <select id="category" name="category" required>
            <option value="">Select category</option>
            <option>Fiction</option>
            <option>Science</option>
            <option>History</option>
            <option>Children's Books</option>
        </select><br><br>

        <label for="title">Book Title:</label>
        <input type="text" id="title" name="title"
               placeholder="Enter book title"><br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" value="1"><br><br>

        <p>Preferred Payment Method:</p>
        <input type="radio" id="cod" name="payment"
               value="Cash on Delivery">
        <label for="cod">Cash on Delivery</label>

        <input type="radio" id="online" name="payment"
               value="Online Payment">
        <label for="online">Online Payment</label><br><br>

        <p>Additional Services:</p>
        <input type="checkbox" id="gift" name="services"
               value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>

        <input type="checkbox" id="bookmark" name="services"
               value="Bookmark">
        <label for="bookmark">Bookmark</label>

        <input type="checkbox" id="express" name="services"
               value="Express Delivery">
        <label for="express">Express Delivery</label>

        <input type="checkbox" id="card" name="services"
               value="Greeting Card">
        <label for="card">Greeting Card</label><br><br>

        <input type="hidden" name="formName"
               value="Readers Haven Book Order">

        <label for="file">Upload Reference Image/Document:</label>
        <input type="file" id="file" name="file"
               accept="image/*,.pdf,.doc,.docx"><br><br>

        <label for="address">Delivery Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="35"
                  placeholder="Enter delivery address"></textarea><br><br>

        <label for="instructions">Special Instructions:</label><br>
        <textarea id="instructions" name="instructions"
                  rows="4" cols="35"
                  placeholder="Any special instructions"></textarea><br><br>

        <button type="submit">Submit Order</button>
        <button type="reset">Reset</button>

    </form>
</body>
</html>
